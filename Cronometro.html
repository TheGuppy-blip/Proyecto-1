<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronómetro de Debate</title>
    <style>
        /* Estilos generales y tipografía */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            font-family: 'Gotham', 'Helvetica', 'Arial', sans-serif;
            overflow: hidden;
            background-color: #222;
            position: relative; /* Para posicionar el panel central */
        }

        /* Contenedor de pantalla dividida */
        .split {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 50%;
            box-sizing: border-box;
            transition: background-color 0.3s ease;
        }

        .lado-azul {
            background-color: #1CB0F6;
            color: white;
            border-right: 4px solid rgba(0, 0, 0, 0.1);
        }

        .lado-rojo {
            background-color: #FF4B4B;
            color: white;
        }

        /* Panel de configuración central */
        .config-panel {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: white;
            padding: 12px 25px;
            border-radius: 20px;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10;
            color: #4b4b4b;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .config-panel .input-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .config-panel input {
            width: 50px;
            padding: 8px;
            font-size: 1.2rem;
            border: 2px solid #e5e5e5;
            border-radius: 12px;
            text-align: center;
            font-family: 'Sugo Pro Display', 'Gotham', 'Arial Black', sans-serif;
            color: #333;
            outline: none;
            transition: border-color 0.2s;
        }

        .config-panel input:focus {
            border-color: #afafaf;
        }

        /* Botón del panel central */
        .btn-config {
            background-color: #e5e5e5;
            color: #777;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-family: 'Gotham', 'Helvetica', 'Arial', sans-serif;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 0 #cccccc;
            transition: all 0.1s ease;
        }

        .btn-config:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #cccccc;
        }

        .btn-config:hover {
            background-color: #d5d5d5;
            color: #555;
        }

        /* Estilo del cronómetro gigante */
        .timer-display {
            font-size: 10vw; 
            font-family: 'Sugo Pro Display', 'Gotham', 'Arial Black', 'Helvetica', sans-serif;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 40px;
            text-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
            font-variant-numeric: tabular-nums; 
            white-space: nowrap; 
        }

        /* Controles de cada lado */
        .controles {
            display: flex;
            gap: 15px;
        }

        .controles button {
            border: none;
            padding: 15px 25px;
            font-size: 1.1rem;
            font-family: 'Gotham', 'Helvetica', 'Arial', sans-serif;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.2);
            transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.2s ease;
        }

        .controles button:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 rgba(0, 0, 0, 0.2);
        }

        .lado-azul .controles button {
            background-color: white;
            color: #1CB0F6;
        }
        .lado-azul .controles button:hover { background-color: #f0f8ff; }

        .lado-rojo .controles button {
            background-color: white;
            color: #FF4B4B;
        }
        .lado-rojo .controles button:hover { background-color: #fff0f0; }
        
        .equipo-titulo {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 20px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <!-- PANEL CENTRAL DE CONFIGURACIÓN -->
    <div class="config-panel">
        <div class="input-group">
            <label for="input-min">Min:</label>
            <input type="number" id="input-min" value="2" min="0">
        </div>
        <div class="input-group">
            <label for="input-seg">Seg:</label>
            <input type="number" id="input-seg" value="0" min="0" max="59">
        </div>
        <button id="btn-aplicar" class="btn-config">Asignar Tiempo</button>
    </div>

    <!-- LADO AZUL -->
    <div class="split lado-azul">
        <div class="equipo-titulo">Equipo Azul</div>
        <div class="timer-display" id="display-azul">02:00</div>
        <div class="controles">
            <button id="iniciar-azul">Iniciar</button>
            <button id="pausar-azul">Pausar</button>
            <button id="reiniciar-azul">Reiniciar</button>
        </div>
    </div>

    <!-- LADO ROJO -->
    <div class="split lado-rojo">
        <div class="equipo-titulo">Equipo Rojo</div>
        <div class="timer-display" id="display-rojo">02:00</div>
        <div class="controles">
            <button id="iniciar-rojo">Iniciar</button>
            <button id="pausar-rojo">Pausar</button>
            <button id="reiniciar-rojo">Reiniciar</button>
        </div>
    </div>

    <script>
        class Cronometro {
            constructor(displayId, btnIniciarId, btnPausarId, btnReiniciarId, tiempoInicial) {
                this.display = document.getElementById(displayId);
                this.btnIniciar = document.getElementById(btnIniciarId);
                this.btnPausar = document.getElementById(btnPausarId);
                this.btnReiniciar = document.getElementById(btnReiniciarId);
                
                this.tiempoTotal = tiempoInicial; 
                this.tiempoRestante = this.tiempoTotal;
                this.intervalo = null;

                this.btnIniciar.addEventListener('click', () => this.iniciar());
                this.btnPausar.addEventListener('click', () => this.pausar());
                this.btnReiniciar.addEventListener('click', () => this.reiniciar());
                
                this.actualizarPantalla();
            }

            // Nuevo método para actualizar el límite de tiempo desde el panel central
            setTiempoTotal(nuevosSegundos) {
                this.tiempoTotal = nuevosSegundos;
                this.reiniciar(); // Pausa y formatea el nuevo tiempo
            }

            iniciar() {
                if (!this.intervalo && this.tiempoRestante > 0) {
                    this.intervalo = setInterval(() => {
                        this.tiempoRestante--;
                        this.actualizarPantalla();
                        
                        if (this.tiempoRestante <= 0) {
                            this.pausar();
                        }
                    }, 1000);
                }
            }

            pausar() {
                clearInterval(this.intervalo);
                this.intervalo = null;
            }

            reiniciar() {
                this.pausar();
                this.tiempoRestante = this.tiempoTotal;
                this.actualizarPantalla();
            }

            actualizarPantalla() {
                const minutos = Math.floor(this.tiempoRestante / 60).toString().padStart(2, '0');
                const segundos = (this.tiempoRestante % 60).toString().padStart(2, '0');
                this.display.textContent = `${minutos}:${segundos}`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Inicializar con 2 minutos (120 segundos) por defecto
            const tiempoPorDefecto = 120;
            const cronoAzul = new Cronometro('display-azul', 'iniciar-azul', 'pausar-azul', 'reiniciar-azul', tiempoPorDefecto);
            const cronoRojo = new Cronometro('display-rojo', 'iniciar-rojo', 'pausar-rojo', 'reiniciar-rojo', tiempoPorDefecto);

            // Lógica del panel central
            const inputMin = document.getElementById('input-min');
            const inputSeg = document.getElementById('input-seg');
            const btnAplicar = document.getElementById('btn-aplicar');

            btnAplicar.addEventListener('click', () => {
                const min = parseInt(inputMin.value) || 0;
                const seg = parseInt(inputSeg.value) || 0;
                const totalSegundos = (min * 60) + seg;

                if (totalSegundos > 0) {
                    cronoAzul.setTiempoTotal(totalSegundos);
                    cronoRojo.setTiempoTotal(totalSegundos);
                }
            });
        });
    </script>
</body>
</html>
